<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kondansatör Analiz</title>

<style>
body{
    font-family: Arial;
    max-width: 500px;
    margin: 30px auto;
    padding:20px;
    background:#f4f4f4;
}

.container{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    padding:15px;
    font-size:20px;
    text-align:center;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h2>Elektrolitik Kondansatör Testi</h2>

<label>Kapasite (µF)</label>
<input type="number" id="uf">

<label>Voltaj (V)</label>
<input type="number" id="volt">

<label>Theta Açısı (°)</label>
<input type="number" id="theta">

<label>Tanδ</label>
<input type="number" step="0.01" id="tandelta">

<button onclick="hesapla()">Analiz Et</button>

<div class="result" id="sonuc"></div>

</div>

<script>

function hesapla(){

let uf = parseFloat(document.getElementById("uf").value);
let theta = parseFloat(document.getElementById("theta").value);
let tan = parseFloat(document.getElementById("tandelta").value);

let durum = "";

if(uf >= 100){

    if(theta <= -85 && tan < 0.15)
        durum = "✅ SAĞLAM";

    else if(theta <= -78 && tan < 0.30)
        durum = "🟡 ORTA";

    else if(theta <= -65 && tan < 0.60)
        durum = "⚠️ ŞÜPHELİ";

    else
        durum = "❌ DEĞİŞTİR";
}

else{

    if(theta <= -80 && tan < 0.25)
        durum = "✅ SAĞLAM";

    else if(theta <= -70 && tan < 0.45)
        durum = "🟡 ORTA";

    else if(theta <= -55 && tan < 0.80)
        durum = "⚠️ ŞÜPHELİ";

    else
        durum = "❌ DEĞİŞTİR";
}

document.getElementById("sonuc").innerHTML = durum;

}

</script>

</body>
</html>
