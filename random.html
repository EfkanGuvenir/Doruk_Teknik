<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timestamp Generator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #1e1e1e;
        color: #eee;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        background: #2b2b2b;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        text-align: center;
        width: 400px;
    }

    .box {
        background: #3a3a3a;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        word-break: break-all;
        font-weight: bold;
        font-size: 16px;
    }

    button {
        padding: 10px 15px;
        margin: 5px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .copy { background: #28a745; color: white; }

    button:hover {
        opacity: 0.9;
    }

    @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0.3; }
        100% { opacity: 1; }
    }

    .blinking {
        animation: blink 0.6s infinite;
    }

    #qrcode {
        display: flex;
        justify-content: center;
        margin-top: 15px;
    }

    svg {
        display: block;
        margin: 15px auto;
    }

    .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #aaa;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Random</h2>

    <div class="box" id="output">---</div>

    <button class="copy" id="copyBtn" onclick="copyText()">Kopyala</button>

    <div id="qrcode"></div>
    <svg id="barcode"></svg>

    <div class="footer">Developer: Doruk Teknik</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<script>
let qr;

function generate() {
    const now = new Date();

    const gun = String(now.getDate()).padStart(2, '0');
    const ay = String(now.getMonth() + 1).padStart(2, '0');
    const yil = String(now.getFullYear()).slice(-2);

    const saat = String(now.getHours()).padStart(2, '0');
    const dakika = String(now.getMinutes()).padStart(2, '0');
    const saniye = String(now.getSeconds()).padStart(2, '0');
   
    const result = gun + ay + yil + saat + dakika + saniye;

    document.getElementById("output").innerText = result;

    document.getElementById("qrcode").innerHTML = "";
    qr = new QRCode(document.getElementById("qrcode"), {
        text: result,
        width: 150,
        height: 150
    });

    JsBarcode("#barcode", result, {
        format: "CODE128",
        displayValue: false
    });
}

function copyText() {
    const text = document.getElementById("output").innerText;
    const btn = document.getElementById("copyBtn");

    navigator.clipboard.writeText(text).then(() => {
        btn.classList.add("blinking");
        setTimeout(() => {
            btn.classList.remove("blinking");
        }, 3000);
    });
}

window.onload = () => {
    generate();
    setInterval(generate, 10000);
};
</script>

</body>
</html>
